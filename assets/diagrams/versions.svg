<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" class="dg" role="img" aria-label="One record for plan.pdf keeps its versions v1, v2 and v3 in one history, with v3 the newest. A second record, brief.pdf, is linked to it through the shared label Alpha">
<rect class="box pop t0" x="8" y="24" width="100" height="108" rx="7"/>
<text class="pop t0 " x="58" y="46">plan.pdf</text>
<line class="ln t1" x1="37" y1="86" x2="49" y2="86" pathLength="100"/><line class="ln t1" x1="67" y1="86" x2="79" y2="86" pathLength="100"/>
<circle class="vnode pop t1" cx="28" cy="86" r="9"/><text class="pop t1 v" x="28" y="90">v1</text>
<circle class="vnode pop t1" cx="58" cy="86" r="9"/><text class="pop t1 v" x="58" y="90">v2</text>
<circle class="vnode hot pop t1" cx="88" cy="86" r="11"/><text class="pop t1 v hot" x="88" y="90">v3</text>
<text class="pop t2 mute" x="58" y="120">versions</text>
<rect class="box pop t0" x="192" y="24" width="100" height="108" rx="7"/>
<text class="pop t0 " x="242" y="46">brief.pdf</text>
<line class="ln t1" x1="212" y1="82" x2="262" y2="82" pathLength="100"/><line class="ln t1" x1="212" y1="92" x2="246" y2="92" pathLength="100"/>
<line class="ln hot t3" x1="108" y1="78" x2="126" y2="78" pathLength="100"/><line class="ln hot t3" x1="174" y1="78" x2="192" y2="78" pathLength="100"/>
<rect class="chip hot pop t3" x="126" y="69" width="48" height="18" rx="9"/><text class="pop t3 " x="150" y="82">Alpha</text>
<text class="pop t4 mute" x="150" y="166">linked by a shared label</text>
</svg>
