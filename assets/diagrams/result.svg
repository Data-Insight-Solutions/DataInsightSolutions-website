<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" class="dg" role="img" aria-label="One record for plan.pdf holds three locations, a stack of versions and its labels. A search for plan finds that single record, and a line links it to a neighbouring record that shares the Alpha label">
