name: deploy
# Builds the site with Reckons.AI (pinned) and deploys to the existing Cloudflare Pages project
# `data-insight-solutions` with wrangler: a preview for pull requests, production for main.
# Cloudflare's own Git integration is not used. No DNS is changed here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Reckons.AI generator that built the approved preview (branch feat/site-section-layout).
  # Bump this pin by pull request to a Reckons.AI main commit after v0.2.8 ships.
  RECKONS_REF: 1a5ba45044eff1885c2724329d6135e0c1a4362c

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require secrets (fail fast)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_CONFIG_OVERRIDE: ${{ secrets.SITE_CONFIG_OVERRIDE }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SITE_CONFIG_OVERRIDE" ] || missing="$missing SITE_CONFIG_OVERRIDE"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Set these repository secrets, then re-run:$missing. Pull requests from forks never receive secrets, so they cannot deploy."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: site

      - uses: actions/checkout@v4
        with:
          repository: Data-Insight-Solutions/Reckons.AI
          ref: ${{ env.RECKONS_REF }}
          path: reckons

      - uses: actions/setup-node@v4
        with:
          node-version-file: reckons/.nvmrc
          cache: npm
          cache-dependency-path: reckons/package-lock.json

      - name: Install Reckons.AI
        working-directory: reckons
        run: npm ci

      - name: Site guard
        working-directory: site
        run: bash scripts/guard-public.sh --all

      - name: Build the site
        working-directory: reckons
        env:
          SITE_CONFIG_OVERRIDE: ${{ secrets.SITE_CONFIG_OVERRIDE }}
        run: |
          umask 077
          override="$RUNNER_TEMP/site-config-override.json"
          printf '%s' "$SITE_CONFIG_OVERRIDE" > "$override"
          npm run site:build -- --site="$GITHUB_WORKSPACE/site" --config-override="$override" --out="$GITHUB_WORKSPACE/dist"
          rm -f "$override"

      - name: Fact expiry (built site)
        working-directory: reckons
        run: npx tsx scripts/offline/fact-expiry.ts --built="$GITHUB_WORKSPACE/dist"

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
        run: |
          npx wrangler@4.160.1 pages deploy dist --project-name=data-insight-solutions --branch="$BRANCH" --commit-dirty=true | tee "$RUNNER_TEMP/wrangler.log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/wrangler.log" | tail -1 || true)"
          {
            echo "### Cloudflare Pages deployment"
            echo "Branch: \`$BRANCH\` (project data-insight-solutions)"
            echo "URL: ${url:-see the wrangler step log}"
          } >> "$GITHUB_STEP_SUMMARY"
